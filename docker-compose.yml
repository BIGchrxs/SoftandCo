services:

  softco-db:
    image: postgres:16
    container_name: softco-db
    environment:
      POSTGRES_DB: softco
      POSTGRES_USER: softco
      # Local development only. Production credentials come from AWS Secrets Manager via the
      # ECS task definition and never appear in this file or in any environment checked into git.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-softco_dev_only}"
    ports:
      # Dedicated loopback port for Visual Studio / dotnet run on the host.
      - "127.0.0.1:5433:5432"
    volumes:
      - softco-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U softco -d softco"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - softco-network

  softco-web:
    build:
      context: .
      dockerfile: SoftCo/Dockerfile
    container_name: softco-web
    depends_on:
      softco-db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Host=softco-db;Port=5432;Database=softco;Username=softco;Password=${POSTGRES_PASSWORD:-softco_dev_only}"
      # Password for the one bootstrap Admin account created on first run. Set it in a local .env
      # file (gitignored) - copy .env.example to .env and fill it in.
      Seed__AdminPassword: "${SEED_ADMIN_PASSWORD:?Set SEED_ADMIN_PASSWORD in a .env file - copy .env.example to .env and fill it in}"
      Seed__AdminEmail: "${SEED_ADMIN_EMAIL:-admin@softandco.co.za}"
      ExchangeRates__ApiKey: "${EXCHANGE_RATE_API_KEY:-}"
      Email__Host: "${EMAIL_HOST:-}"
      Email__Port: "${EMAIL_PORT:-587}"
      Email__User: "${EMAIL_USER:-}"
      Email__Password: "${EMAIL_PASSWORD:-}"
      Email__FromAddress: "${EMAIL_FROM_ADDRESS:-noreply@softandco.co.za}"
      Email__FromName: "${EMAIL_FROM_NAME:-Soft & Co.}"
    ports:
      - "5280:8080"
    networks:
      - softco-network

networks:
  softco-network:
    driver: bridge

volumes:
  softco-db-data:
